spring.datasource.url=${DB_URL:jdbc:mysql://localhost/gastronomique?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

gastronomique.app.jwtSecret=${JWT_SECRET}
gastronomique.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
